name: Ingestor OpenSky

# Publica lecturas reales de OpenSky en opensky-states-v1 (T-03, T-04 y T-05):
# un mensaje opensky.state.v2 por lectura con los vuelos de aerolinea (US-43,
# T-160 y T-161). Area por defecto: la costa este de EE. UU. (T-159), la misma
# geografia de BTS; cada lectura cuesta 3 creditos de OpenSky (T-158).
#
# Lo dispara Cloud Scheduler cada 2 minutos por workflow_dispatch
# (disparar_ingestor_opensky, US-24). Ya no tiene un schedule propio: el cron
# de GitHub corria ademas del de Cloud Scheduler y duplicaba lecturas.

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Area a consultar: lamin,lomin,lamax,lomax (por defecto, la costa este de EE. UU.)."
        required: false
        default: "24.5,-85.0,43.0,-69.5"

permissions:
  contents: read
  id-token: write # necesario para Workload Identity Federation

concurrency:
  group: ingestor-opensky
  cancel-in-progress: false

jobs:
  ingestar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Instalar dependencias
        run: pip install -r ingestor/requirements.txt

      - name: Autenticar en Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Obtener y publicar estados
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GCP_PROJECT_ID: flighttracker-506923
          PUBSUB_TOPIC: opensky-states-v1
          # Si el disparo no trae bbox, se usa la costa este de EE. UU.
          OPENSKY_BBOX: ${{ inputs.bbox || '24.5,-85.0,43.0,-69.5' }}
        run: python ingestor/publicar_estados.py
