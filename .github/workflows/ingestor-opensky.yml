name: Ingestor OpenSky

# Publica estados reales de OpenSky en opensky-states-v1 (T-03, T-04 y T-05).
# Area por defecto: Colombia. Se acota para controlar el volumen de escrituras
# en Firestore y el consumo de creditos de la API de OpenSky.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      bbox:
        description: "Area a consultar: lamin,lomin,lamax,lomax (por defecto, Colombia)."
        required: false
        default: "-4.3,-79.1,13.5,-66.8"

permissions:
  contents: read
  id-token: write # necesario para Workload Identity Federation

concurrency:
  group: ingestor-opensky
  cancel-in-progress: false

jobs:
  ingestar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Instalar dependencias
        run: pip install -r ingestor/requirements.txt

      - name: Autenticar en Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Obtener y publicar estados
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GCP_PROJECT_ID: flighttracker-506923
          PUBSUB_TOPIC: opensky-states-v1
          # En las corridas del cron no hay inputs, asi que se usa Colombia.
          OPENSKY_BBOX: ${{ inputs.bbox || '-4.3,-79.1,13.5,-66.8' }}
        run: python ingestor/publicar_estados.py
